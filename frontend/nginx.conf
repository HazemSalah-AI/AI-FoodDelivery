limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
map $http_x_forwarded_proto $upstream_scheme {
    default $scheme;
    https https;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    # Production port is private; Caddy replaces incoming forwarded headers.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $upstream_scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
    }
    location /api/ {
        proxy_pass http://backend:8000;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
